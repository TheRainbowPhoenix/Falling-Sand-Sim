<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Sand Simulator</title>
    <style>
        body {
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            image-rendering: pixelated;
            border: 1px solid #555;
            background-color: #000;
            cursor: crosshair;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Falling Sand Simulator</h1>
    <canvas id="gameCanvas" width="320" height="528"></canvas>
    <button id="saveBtn">Save Screenshot</button>

    <script src="main.js"></script>
</body>
</html>
